server {
    listen 80;
    server_name localhost;
    index index.php index.html;

    # Laravel public directory
    root /var/www/server/public;

    # Increase max upload size for XML files
    client_max_body_size 100M;

    # ----------------------------------------------------------------------
    # VITE PROXY SETTINGS (For Dev Mode)
    # ----------------------------------------------------------------------
    
    # Proxy specific Vite paths to the Node container
    # Catch all vite-related paths. We use a case-insensitive regex match (~*)
    # and we don't enforce a trailing slash immediately after the group.
    location ~* ^/(@vite|@react-refresh|@id|src|node_modules|resources|app|assets) {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Vite HMR Websocket
    location /__vite_hmr {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Fallback: if a file doesn't exist in Laravel public, try Vite (for assets)
    # This helps if some assets are requested without the specific prefixes
    location @vite_proxy {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------------------
    # PHP / LARAVEL SETTINGS
    # ----------------------------------------------------------------------

    # Handle PHP files
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
    }

    # Laravel routing (send non-file requests to index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Storage folder (for public assets)
    location ^~ /storage/ {
        alias /var/www/server/public/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Block hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block sensitive files
    location ~* \.(env|git|env\.example|yml|yaml|ini|log|sql|conf|config|sh|pem|key|json)$ {
        deny all;
        return 404;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
    