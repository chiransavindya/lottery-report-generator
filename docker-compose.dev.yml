services:
  app:
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost

  node:
    command: [ "sh", "-lc", "if [ ! -d node_modules ] || [ ! -x node_modules/.bin/vite ]; then npm ci; fi; npm run dev-exposed" ]
    environment:
      - VITE_HMR_HOST=localhost
      - APP_URL=http://localhost
    ports:
      - "5173:5173"

  nginx:
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
