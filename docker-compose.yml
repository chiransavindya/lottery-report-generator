services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /var/www/server
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
    volumes:
      - ./:/var/www
      - ./server/.env:/var/www/server/.env:ro
    networks:
      - appnet
    healthcheck:
      test: [ "CMD-SHELL", "php-fpm-healthcheck || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  node:
    image: node:20-alpine
    working_dir: /var/www/client
    depends_on:
      - app
    environment:
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--max_old_space_size=4096
    volumes:
      - ./:/var/www
      - node_modules:/var/www/client/node_modules
    command: [ "sh", "-lc", "if [ ! -d node_modules ] || [ ! -x node_modules/.bin/vite ]; then npm ci; fi; npm run dev-exposed" ]
    ports:
      - "5173:5173"
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - app
      - node
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - appnet

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Abcd@1234
      MYSQL_DATABASE: NewspaperReport_gen
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pAbcd@1234" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  node_modules:


networks:
  appnet:
    driver: bridge
